<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Socialz Marketplace</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --text: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg) 70%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .domain-suffix {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-weight: 400;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        button:active {
            transform: translateY(0);
        }

        #status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            padding: 0.75rem;
            border-radius: 8px;
            display: none;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block !important;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Claim Your Domain</h1>
            <p>Enter your preferred name to create your unique E-Socialz space.</p>
            
            <div class="input-group">
                <input type="text" id="subdomain" placeholder="your-name">
                <span class="domain-suffix">.esocialz.com</span>
            </div>

            <div class="input-group">
                <input type="text" id="ip" placeholder="Target IP (e.g. 1.2.3.4)" value="127.0.0.1">
            </div>

            <button onclick="claimDomain()">Claim Identity</button>

            <div id="status"></div>
        </div>
    </div>

    <script>
        async function claimDomain() {
            const subdomain = document.getElementById('subdomain').value;
            const ip = document.getElementById('ip').value;
            const status = document.getElementById('status');
            
            if (!subdomain) {
                status.textContent = 'Please enter a subdomain';
                status.className = 'status-error';
                return;
            }

            status.textContent = 'Processing...';
            status.className = '';
            status.style.display = 'block';

            try {
                const response = await fetch('/api/claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subdomain, ip })
                });

                const data = await response.json();

                if (response.ok) {
                    status.innerHTML = `Success! Visit <a href="http://${subdomain}.esocialz.com" style="color: inherit"><b>${subdomain}.esocialz.com</b></a>`;
                    status.className = 'status-success';
                } else {
                    status.textContent = data.error || 'Claim failed';
                    status.className = 'status-error';
                }
            } catch (err) {
                status.textContent = 'Connection error. Is the backend running?';
                status.className = 'status-error';
            }
        }
    </script>
</body>
</html>
