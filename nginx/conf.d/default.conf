server {
    listen 80;
    server_name esocialz.com www.esocialz.com;

    location / {
        proxy_pass http://portal-api:3000; # Route main domain to the Portal API/Frontend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name *.esocialz.com;

    location / {
        # Dynamic routing logic
        # For now, we point them to a 'Profile Gateway'
        proxy_pass http://portal-api:3000/api/profile?domain=$host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
